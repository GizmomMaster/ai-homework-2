# Три сервиса в общей внутренней сети. Core и telegram-bot наружу не
# публикуют ни одного порта: адаптер сам ходит в Telegram (long polling —
# исходящее соединение), а Core доступен только адаптеру по имени сервиса.
# У dashboard порт публикуется — его открывают глазами в браузере, а не
# вызывают по HTTP-контракту, поэтому исключение оправдано.

services:
  core:
    build: ./core
    env_file:
      - ./core/.env
    environment:
      # Внутри сети compose адаптер известен по имени сервиса.
      ADAPTER_TELEGRAM_CALLBACK_URL: http://telegram-bot:8081/callbacks/replies
      CORE_HOST: 0.0.0.0
    volumes:
      # История диалогов и очередь заданий переживают пересоздание контейнера.
      - ./core/data:/app/data
    # Позволяет контейнеру достучаться до локальной LLM (LM Studio, Ollama),
    # запущенной на хосте, по имени host.docker.internal (нужно для Linux;
    # на Docker Desktop работает само).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  telegram-bot:
    build: ./telegram-bot
    env_file:
      - ./telegram-bot/.env
    environment:
      CORE_BASE_URL: http://core:8080
      CALLBACK_HOST: 0.0.0.0
      CALLBACK_PORT: "8081"
    depends_on:
      core:
        # Ждём, пока Core начнёт отвечать на /health: иначе первые сообщения
        # упрутся в недоступный сервис.
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8090"
      # Тот же файл, что core/data/core.db, — тот же volume, что у core, но
      # смонтированный read-only: дашборд только читает телеметрию
      # (llm_calls, tool_calls), ему незачем даже теоретически иметь право
      # что-то в этой базе поменять.
      DASHBOARD_DB_PATH: /app/data/core.db
    volumes:
      - ./core/data:/app/data:ro
    ports:
      # Единственный порт, публикуемый наружу, — дашборд открывают в браузере.
      # Только на петлевом адресе: страница задания показывает тексты запросов
      # пользователей, а проверки доступа у дашборда нет вовсе. На 0.0.0.0 это
      # означало бы переписку в чатах, открытую всей локальной сети.
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
